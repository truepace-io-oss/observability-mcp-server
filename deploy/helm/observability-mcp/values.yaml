# Default values for observability-mcp.

image:
  repository: ghcr.io/truepace-io-oss/observability-mcp-server   # set to ghcr.io/<your-org>/observability-mcp-server
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Image pull secret. When externalSecrets.enabled and imagePullSecret.esoRef are
# set, a dockerconfigjson Secret is created via ESO; otherwise set an existing
# secret name in imagePullSecret.existingSecret.
imagePullSecret:
  esoRef: ""         # Bitwarden (or other backend) UUID for a dockerconfigjson
  existingSecret: "" # use a pre-existing pull secret instead

replicaCount: 1

# ---- Server configuration (rendered into a ConfigMap as config.yaml) --------
config:
  logLevel: "info"          # debug|info|warn|error
  readOnly: false           # global kill-switch for all mutating tools
  defaultDatasource: ""     # must match a datasource name below

# The observability datasources this instance queries. Each entry is rendered
# into config.yaml. When a datasource references a secret (basic-auth password,
# bearer token, custom CA) via ESO, the resulting Secret is mounted at
# /etc/omcp/datasources/<name>/{password,token,ca.crt}.
datasources: []
  # - name: vm
  #   type: victoriametrics          # victoriametrics|prometheus|victorialogs|alertmanager
  #   url: http://vmselect-...:8481
  #   pathPrefix: "/select/0/prometheus"
  #   readOnly: false
  #   timeout: "30s"
  #   tls: { insecureSkipTLSVerify: false, caEsoRef: "" }   # caEsoRef -> ExternalSecret key ca.crt -> mounted caFile
  #   auth:
  #     basic: { username: "", esoRef: "" }   # esoRef -> ExternalSecret key `password` -> mounted passwordFile
  #     bearer: { esoRef: "" }                # esoRef -> ExternalSecret key `token` -> mounted tokenFile

# Prometheus metrics on a SEPARATE, unauthenticated port (never behind the MCP
# auth or the public ingress). serviceMonitor.enabled requires metrics.enabled.
metrics:
  enabled: true
  port: 9091

# ---- Agent → MCP authentication (client-side link) --------------------------
# Independent of datasource auth. Disabled by default (protect via internal ingress).
# When enabled, always run behind TLS.
auth:
  enabled: false
  # (1) Shared bearer tokens. Each token's secret is provided via ESO (default)
  #     or an existing Secret; it is mounted at /etc/omcp/auth/<name>/token.
  static:
    enabled: false
    tokens: []
      # - name: ci
      #   eso:
      #     ref: <backend-uuid>       # ESO ExternalSecret → key `token`
      # - name: legacy
      #   existingSecret: my-secret   # must contain key `token`
  # (2) OIDC resource server (Authentik / Keycloak). Needs no secret — JWKS is
  #     public.
  oidc:
    enabled: false
    issuer: ""                # Authentik: .../application/o/<slug>/ ; Keycloak: .../realms/<realm>
    audience: ""              # == this MCP's public URL == token `aud`
    jwksUrl: ""
    requiredScopes: []
    requiredGroups: []
    groupsClaim: "groups"
    usernameClaim: "preferred_username"
    resourceMetadata: true

# ---- External Secrets Operator ---------------------------------------------
externalSecrets:
  enabled: true
  secretStore:
    kind: ClusterSecretStore      # or SecretStore
    name: bitwarden-secretsmanager
  refreshInterval: 1h

service:
  type: ClusterIP
  port: 80
  targetPort: 9090

# Ingress. Disabled by default. The MCP transport has NO built-in auth — only
# expose it on an internal (e.g. WireGuard) ingress, never publicly.
ingress:
  enabled: false
  className: nginx-internal
  host: ""                        # e.g. observability-mcp.intern.tools.averion.zone
  annotations:
    # Streamable-HTTP needs long-lived, unbuffered connections.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: ""                # defaults to <fullname>-tls
  # Optional HTTP basic-auth on top of the internal ingress.
  basicAuth:
    enabled: false
    esoRef: ""                    # backend UUID for an htpasswd blob (key: auth)
    existingSecret: ""

serviceMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: "10s"
  labels: {}

# Grafana dashboard shipped as a ConfigMap the Grafana sidecar auto-discovers
# (via the label below). Requires the Grafana dashboard sidecar in the cluster.
grafanaDashboard:
  enabled: false
  label: grafana_dashboard      # sidecar discovery label
  labelValue: "1"
  folder: ""                    # optional Grafana folder name
  folderAnnotation: grafana_folder  # annotation key the sidecar reads for the folder
                                     # (kube-prometheus-stack: grafana_folder ; victoria-metrics-k8s-stack: grafana-folder)
  namespace: ""                 # optional; default = release namespace
  extraLabels: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pod-level security context; the container runs as nonroot with a read-only
# root filesystem (the distroless image ships no shell). runAsUser is the
# numeric UID of the distroless "nonroot" user — required so Kubernetes can
# verify runAsNonRoot (the image's USER is a name, not a number).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
