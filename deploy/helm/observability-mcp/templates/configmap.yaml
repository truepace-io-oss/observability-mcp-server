apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability-mcp.fullname" . }}
  labels:
    {{- include "observability-mcp.labels" . | nindent 4 }}
data:
  config.yaml: |
    listenAddr: "0.0.0.0:9090"
    metricsAddr: {{ if .Values.metrics.enabled }}{{ printf ":%v" .Values.metrics.port | quote }}{{ else }}"off"{{ end }}
    logLevel: {{ .Values.config.logLevel | quote }}
    readOnly: {{ .Values.config.readOnly }}
    defaultDatasource: {{ .Values.config.defaultDatasource | quote }}
    datasources:
    {{- range .Values.datasources }}
      - name: {{ .name | quote }}
        type: {{ .type | quote }}
        url: {{ .url | quote }}
        pathPrefix: {{ default "" .pathPrefix | quote }}
        readOnly: {{ default false .readOnly }}
        timeout: {{ default "30s" .timeout | quote }}
        {{- if and .tls .tls.caEsoRef }}
        tls:
          caFile: /etc/omcp/datasources/{{ .name }}/ca.crt
        {{- end }}
        {{- if or (and .auth .auth.basic .auth.basic.esoRef) (and .auth .auth.bearer .auth.bearer.esoRef) }}
        auth:
          {{- if and .auth.basic .auth.basic.esoRef }}
          basic:
            username: {{ default "" .auth.basic.username | quote }}
            passwordFile: /etc/omcp/datasources/{{ .name }}/password
          {{- end }}
          {{- if and .auth.bearer .auth.bearer.esoRef }}
          bearer:
            tokenFile: /etc/omcp/datasources/{{ .name }}/token
          {{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.auth.enabled }}
    auth:
      enabled: true
      static:
        enabled: {{ .Values.auth.static.enabled }}
        tokens:
        {{- range .Values.auth.static.tokens }}
          - name: {{ .name | quote }}
            tokenFile: /etc/omcp/auth/{{ .name }}/token
        {{- end }}
      oidc:
        enabled: {{ .Values.auth.oidc.enabled }}
        issuer: {{ .Values.auth.oidc.issuer | quote }}
        audience: {{ .Values.auth.oidc.audience | quote }}
        jwksUrl: {{ .Values.auth.oidc.jwksUrl | quote }}
        groupsClaim: {{ .Values.auth.oidc.groupsClaim | quote }}
        usernameClaim: {{ .Values.auth.oidc.usernameClaim | quote }}
        resourceMetadata: {{ .Values.auth.oidc.resourceMetadata }}
        requiredScopes: {{ toJson .Values.auth.oidc.requiredScopes }}
        requiredGroups: {{ toJson .Values.auth.oidc.requiredGroups }}
    {{- end }}
